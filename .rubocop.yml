plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  DisplayCopNames: true
  Exclude:
    - bin/**/*
    - .*/**/*
    - coverage/**/*
    - log/**/*
    - tmp/**/*
    - vendor/**/*
    - spec/fixtures/**/*
    - spec/files/**/*
    - lint/**/*
    - .gemspec/**/*
    - .bundle/**/*
    - gemfiles/**/*
    - node_modules/**/*

Layout/LineLength:
  Max: 120

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented_relative_to_receiver

Lint/AmbiguousBlockAssociation:
  AllowedMethods: [change]

Lint/StructNewOverride:
  Exclude:
    - lib/castle/command.rb # public Struct member name kept for backward compat

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/AbcSize:
  Max: 30

Metrics/CyclomaticComplexity:
  Max: 12

Naming/FileName:
  Exclude:
    - '*.gemspec'
    - lib/castle-rb.rb # canonical gem-name require shim

Performance/MethodObjectAsBlock:
  Exclude:
    - lib/castle.rb # historical pattern in the require manifest

Performance/StringInclude:
  Enabled: false

Performance/Sum:
  Enabled: false

RSpec/EmptyExampleGroup:
  Enabled: false

RSpec/ExampleLength:
  Max: 10

RSpec/MultipleExpectations:
  Max: 3

RSpec/MultipleMemoizedHelpers:
  Max: 17

RSpec/NestedGroups:
  Max: 4

RSpec/PendingWithoutReason:
  Enabled: false

RSpec/SpecFilePathFormat:
  Enabled: false

Security/YAMLLoad:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Style/HashEachMethods:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/NumericLiterals:
  Enabled: false

Style/OpenStructUse:
  Exclude:
    - spec/**/* # OpenStruct is fine inside test doubles

Style/RedundantFetchBlock:
  Enabled: false

Style/RedundantParentheses:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes
