require:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - bin/**/*
    - .*/**/*
    - coverage/**/*
    - log/**/*
    - tmp/**/*
    - vendor/**/*
    - spec/fixtures/**/*
    - spec/files/**/*
    - lint/**/*
    - .gemspec/**/*
    - .bundle/**/*
    - gemfiles/**/*

Style/IfUnlessModifier:
  Enabled: false

Style/RedundantFetchBlock:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/NumericLiterals:
  Enabled: false

Style/FormatStringToken:
  Enabled: false

Style/DoubleNegation:
  Enabled: false

Style/RedundantParentheses:
  Enabled: false

Style/HashEachMethods:
  Enabled: false

Layout/LineLength:
  Max: 120

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented_relative_to_receiver

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/AbcSize:
  Max: 30

Metrics/CyclomaticComplexity:
  Max: 12

Naming/FileName:
  Exclude:
    - '*.gemspec'

Lint/AmbiguousBlockAssociation:
  AllowedMethods: [change]

Performance/Sum:
  Enabled: false

Performance/StringInclude:
  Enabled: false

Security/YAMLLoad:
  Enabled: false

RSpec/MultipleExpectations:
  Max: 3

RSpec/NestedGroups:
  Max: 4

RSpec/ExampleLength:
  Max: 10

RSpec/MultipleMemoizedHelpers:
  Max: 15

RSpec/EmptyExampleGroup:
  Enabled: false
